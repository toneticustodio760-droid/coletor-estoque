<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coletor Visual de Estoque (SAGA / Gestão por Exceção)</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg: #0b1329;
            --card-bg: #1c2541;
            --border: #3a506b;
            --text: #ffffff;
            --accent: #5bc0be;
            --green: #22c55e;
            --red: #ef4444;
            --blue: #3b82f6;
            --gray: #334155;
            --amber: #f59e0b;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        .container { max-width: 1250px; margin: 0 auto; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        h1 { margin: 0; font-size: 20px; color: var(--accent); }

        .header-actions { display: flex; align-items: center; gap: 10px; }
        .status-sync { font-size: 12px; font-weight: bold; padding: 6px 12px; border-radius: 20px; background: #334155; color: #94a3b8; }
        .status-sync.online { background: #14532d; color: #4ade80; }

        .btn-nova-sessao { background: var(--amber); color: #000; font-weight: bold; padding: 6px 12px; border: none; border-radius: 20px; cursor: pointer; font-size: 12px; transition: 0.2s; }
        .btn-nova-sessao:hover { background: #d97706; color: #fff; }

        .kpi-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .kpi-card { background: var(--card-bg); border: 1px solid var(--border); padding: 12px; border-radius: 8px; text-align: center; }
        .kpi-title { font-size: 11px; color: #94a3b8; font-weight: bold; text-transform: uppercase; }
        .kpi-val { font-size: 22px; font-weight: bold; color: var(--accent); margin-top: 4px; }

        .dashboard-grid { display: grid; grid-template-columns: 2.2fr 1fr; gap: 20px; }
        @media (max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }

        .card { background: var(--card-bg); border: 1px solid var(--border); padding: 15px; border-radius: 12px; }

        .selector-bar { display: flex; gap: 8px; margin-bottom: 15px; background: #0b1329; padding: 10px; border-radius: 8px; border: 1px solid var(--border); }
        .select-group { flex: 1; }
        .select-group label { display: block; font-size: 10px; color: var(--accent); font-weight: bold; margin-bottom: 4px; text-transform: uppercase; }
        select { width: 100%; padding: 8px; background: #1c2541; color: #fff; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; font-weight: bold; outline: none; }
        select:disabled { opacity: 0.4; cursor: not-allowed; }

        .rack-frame { border: 2px solid #64748b; background: #0b1329; padding: 12px; border-radius: 8px; display: flex; flex-direction: column; gap: 8px; min-height: 280px; max-height: 520px; overflow-y: auto; }
        
        .floor-level { display: flex; align-items: center; gap: 10px; border-bottom: 1px dashed #334155; padding-bottom: 8px; }
        .floor-label { width: 70px; font-size: 12px; font-weight: bold; color: #94a3b8; text-align: right; }
        .apt-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: 1; }

        .apt-box {
            background: #1e293b; border: 2px solid var(--border); border-radius: 6px; padding: 10px; text-align: center;
            cursor: pointer; transition: all 0.2s; user-select: none;
        }
        .apt-box:hover { border-color: var(--accent); }
        .apt-box.selected { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.6); background: #0f172a; }

        .apt-title { font-size: 13px; font-weight: bold; }
        .apt-sub { font-size: 10px; margin-top: 3px; font-weight: 600; opacity: 0.9; }

        .action-area { background: #0b1329; border: 1px solid var(--border); padding: 12px; border-radius: 8px; margin-top: 15px; text-align: center; }
        .action-btns { display: flex; gap: 8px; margin-top: 10px; }
        .btn { flex: 1; padding: 12px 8px; border: none; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; color: #fff; transition: 0.2s; }
        .btn-sim { background: var(--green); }
        .btn-nao { background: var(--red); }
        .btn-vazio { background: var(--blue); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .chart-native-container { display: flex; flex-direction: column; gap: 14px; width: 100%; margin-top: 15px; }
        .progress-group { display: flex; flex-direction: column; gap: 4px; }
        .progress-label-row { display: flex; justify-content: space-between; font-size: 12px; font-weight: bold; }
        .progress-bar-bg { background: #0b1329; border: 1px solid var(--border); border-radius: 6px; height: 16px; overflow: hidden; width: 100%; }
        .progress-fill { height: 100%; transition: width 0.4s ease; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🏗️ Coletor Visual de Estoque (SAGA)</h1>
        <div class="header-actions">
            <button class="btn-nova-sessao" onclick="iniciarNovaContagem()">➕ Iniciar Nova Contagem</button>
            <div id="status-sync" class="status-sync">Carregando base do SAGA...</div>
        </div>
    </header>

    <div class="dashboard-grid">
        <div class="card">
            <div class="selector-bar">
                <div class="select-group">
                    <label>1. Depósito (Obrigatório)</label>
                    <select id="sel-dep" onchange="atualizarRuas()">
                        <option value="">Selecione o Depósito...</option>
                    </select>
                </div>
                <div class="select-group">
                    <label>2. Rua</label>
                    <select id="sel-rua" onchange="atualizarPredios()" disabled>
                        <option value="">Selecione...</option>
                    </select>
                </div>
                <div class="select-group">
                    <label>3. Prédio</label>
                    <select id="sel-predio" onchange="renderizarPortaPalete()" disabled>
                        <option value="">Selecione...</option>
                    </select>
                </div>
            </div>

            <div id="rack-container" class="rack-frame">
                <div style="text-align: center; color: #94a3b8; margin-top: 80px; font-size: 13px;">
                    ⚠️ Selecione um Depósito, Rua e Prédio para carregar as posições da base.
                </div>
            </div>

            <div class="action-area">
                <div style="font-size: 10px; color: #94a3b8; font-weight: bold; text-transform: uppercase;">Posição Selecionada:</div>
                <div id="selected-label" style="font-size: 16px; font-weight: bold; color: var(--accent); margin: 4px 0;">Nenhuma</div>
                
                <div class="action-btns">
                    <button id="btn-sim" class="btn btn-sim" onclick="validar('Livre')" disabled>🟢 Livre</button>
                    <button id="btn-nao" class="btn btn-nao" onclick="validar('Ocupado')" disabled>🔴 Ocupado</button>
                    <button id="btn-vazio" class="btn btn-vazio" onclick="validar('Palete Vazio')" disabled>🔵 Palete Vazio</button>
                </div>
            </div>
        </div>

        <div class="card">
            <h3 style="margin-top:0; color:#94a3b8; font-size:13px; text-transform:uppercase; border-bottom: 1px solid var(--border); padding-bottom: 8px;">Avanço em Tempo Real</h3>
            
            <div class="kpi-container" style="grid-template-columns: repeat(2, 1fr); margin-top: 10px;">
                <div class="kpi-card"><div class="kpi-title">Total Auditado</div><div id="kpi-total" class="kpi-val">0</div></div>
                <div class="kpi-card"><div class="kpi-title">Confiabilidade</div><div id="kpi-conf" class="kpi-val">0%</div></div>
            </div>

            <div class="chart-native-container">
                <div class="progress-group">
                    <div class="progress-label-row"><span style="color:var(--green)">🟢 Livre</span><span id="txt-livre">0 (0%)</span></div>
                    <div class="progress-bar-bg"><div id="bar-livre" class="progress-fill" style="width: 0%; background: var(--green);"></div></div>
                </div>
                <div class="progress-group">
                    <div class="progress-label-row"><span style="color:var(--red)">🔴 Ocupado</span><span id="txt-ocupado">0 (0%)</span></div>
                    <div class="progress-bar-bg"><div id="bar-ocupado" class="progress-fill" style="width: 0%; background: var(--red);"></div></div>
                </div>
                <div class="progress-group">
                    <div class="progress-label-row"><span style="color:var(--blue)">🔵 Palete Vazio</span><span id="txt-vazio">0 (0%)</span></div>
                    <div class="progress-bar-bg"><div id="bar-vazio" class="progress-fill" style="width: 0%; background: var(--blue);"></div></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 1. Carrega os endereços brutos locais -->
<script src="enderecos.js"></script>

<!-- 2. Lógica principal integrada -->
<script>
    const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbzNKB1Ijv1CHi2GZY-zcCxksjolzlsvrbCsHy-Imuwkp1vsiq16sL6hrrttD2icbhsRDw/exec";

    let basePosicoesSaga = [];      
    let enderecosSagaSet = new Set(); 
    let baseSagaOcupacao = [];
    let auditDados = [];
    let selectedTempPos = null;
    let sessaoAtual = parseInt(localStorage.getItem('sessaoAtual') || '1');

    window.addEventListener('DOMContentLoaded', () => {
        carregarBaseCompleta();
    });

    async function carregarBaseCompleta() {
    const st = document.getElementById('status-sync');
    if (st) {
        st.innerText = "Carregando endereços locais...";
        st.classList.remove('online');
    }

    try {
        // 1. Carrega os endereços do arquivo local (enderecos.js)
        if (typeof textoEnderecosBrutos !== 'undefined') {
            basePosicoesSaga = textoEnderecosBrutos.split('\n')
                .map(linha => linha.trim())
                .filter(linha => linha.length > 0)
                .map(end => ({ ENDERECO: end }));
        } else {
            console.error("Variável 'textoEnderecosBrutos' não encontrada.");
            if (st) st.innerText = "● Erro: enderecos.js ausente";
            return;
        }

        // 2. Busca os dados do Google Sheets (SAGA e Respostas)
        const respostaSheets = await fetch(URL_GOOGLE_SCRIPT);
        const data = await respostaSheets.json();
        
        baseSagaOcupacao = Array.isArray(data.saga) ? data.saga : (Array.isArray(data) ? data : []);
        auditDados = Array.isArray(data.respostas) ? data.respostas : [];

        enderecosSagaSet.clear();
        
        baseSagaOcupacao.forEach(item => {
            // Procura dinamicamente qualquer chave que pareça endereço (independente de acento ou maiúsculas)
            const chaveEnd = Object.keys(item).find(k => {
                const upper = k.toUpperCase();
                return upper.includes('ENDERE') || upper.includes('POSICAO') || upper.includes('POSIÇÃO');
            });

            if (chaveEnd && item[chaveEnd]) {
                const valorEnd = String(item[chaveEnd]).trim().toUpperCase();
                enderecosSagaSet.add(valorEnd);
            }
        });

        console.log("Total de endereços carregados no SAGA Set:", enderecosSagaSet.size);

        if (st) {
            st.innerText = `● Contagem #${sessaoAtual} (Pronto)`;
            st.classList.add('online');
        }
        
        popularDepositos();
        atualizarDashboard();

    } catch (err) {
        if (st) {
            st.innerText = "● Erro ao carregar SAGA (Verifique CORS/Rede)";
        }
        console.error("Erro no carregamento:", err);
    }
}

    function popularDepositos() {
        const selDep = document.getElementById('sel-dep');
        const depositosUnicos = [...new Set(
            basePosicoesSaga.map(item => {
                const end = String(item['ENDERECO'] || '');
                const partes = end.split('.');
                return partes.length > 0 ? partes[0] : null;
            })
        )].filter(Boolean).sort();

        let html = '<option value="">Selecione o Depósito...</option>';
        depositosUnicos.forEach(dep => {
            html += `<option value="${dep}">Depósito ${dep}</option>`;
        });
        selDep.innerHTML = html;
    }

    function atualizarRuas() {
        const depSel = document.getElementById('sel-dep').value;
        const selRua = document.getElementById('sel-rua');
        const selPredio = document.getElementById('sel-predio');

        selRua.innerHTML = '<option value="">Selecione...</option>';
        selPredio.innerHTML = '<option value="">Selecione...</option>';
        selPredio.disabled = true;

        if (!depSel) {
            selRua.disabled = true;
            return;
        }

        const ruasUnicas = [...new Set(
            basePosicoesSaga.map(item => {
                const end = String(item['ENDERECO'] || '');
                const partes = end.split('.');
                if (partes.length >= 3 && partes[0] === depSel) {
                    return partes[2];
                }
                return null;
            })
        )].filter(Boolean).sort();

        let html = '<option value="">Selecione a Rua...</option>';
        ruasUnicas.forEach(rua => {
            html += `<option value="${rua}">Rua ${rua}</option>`;
        });
        selRua.innerHTML = html;
        selRua.disabled = false;
    }

    function atualizarPredios() {
        const depSel = document.getElementById('sel-dep').value;
        const ruaSel = document.getElementById('sel-rua').value;
        const selPredio = document.getElementById('sel-predio');

        selPredio.innerHTML = '<option value="">Selecione...</option>';

        if (!ruaSel) {
            selPredio.disabled = true;
            return;
        }

        const prediosUnicos = [...new Set(
            basePosicoesSaga.map(item => {
                const end = String(item['ENDERECO'] || '');
                const partes = end.split('.');
                if (partes.length >= 4 && partes[0] === depSel && partes[2] === ruaSel) {
                    return partes[3];
                }
                return null;
            })
        )].filter(Boolean).sort();

        let html = '<option value="">Selecione o Prédio...</option>';
        prediosUnicos.forEach(predio => {
            html += `<option value="${predio}">Prédio ${predio}</option>`;
        });
        selPredio.innerHTML = html;
        selPredio.disabled = false;
    }

    function renderizarPortaPalete() {
        const dep = document.getElementById('sel-dep').value;
        const rua = document.getElementById('sel-rua').value;
        const predio = document.getElementById('sel-predio').value;

        const container = document.getElementById('rack-container');
        container.innerHTML = '';

        if (!dep || !rua || !predio) {
            container.innerHTML = '<div style="text-align: center; color: #94a3b8; margin-top: 80px; font-size: 13px;">⚠️ Selecione Depósito, Rua e Prédio válidos.</div>';
            return;
        }

        const posicoesDoPredio = basePosicoesSaga.filter(item => {
            const end = String(item['ENDERECO'] || '');
            const partes = end.split('.');
            if (partes.length >= 4) {
                return partes[0] === dep && partes[2] === rua && partes[3] === predio;
            }
            return false;
        });

        if (posicoesDoPredio.length === 0) {
            container.innerHTML = '<div style="text-align: center; color: #ef4444; margin-top: 80px; font-size: 13px;">❌ Nenhuma posição encontrada no cadastro.</div>';
            return;
        }

        const andaresMap = {};
        posicoesDoPredio.forEach(p => {
            const end = String(p['ENDERECO'] || '');
            const partes = end.split('.');
            const andar = partes[4] || '1';
            if (!andaresMap[andar]) andaresMap[andar] = [];
            andaresMap[andar].push(p);
        });

        const andaresOrdenados = Object.keys(andaresMap).sort((a, b) => parseInt(b) - parseInt(a));
        selectedTempPos = null;

        andaresOrdenados.forEach(andarNum => {
            const row = document.createElement('div');
            row.className = 'floor-level';

            const label = document.createElement('div');
            label.className = 'floor-label';
            label.innerText = `Andar ${andarNum}`;
            row.appendChild(label);

            const pairGrid = document.createElement('div');
            pairGrid.className = 'apt-pair';

            let aptsDoAndar = andaresMap[andarNum].sort((a, b) => {
                const endA = String(a['ENDERECO'] || '');
                const endB = String(b['ENDERECO'] || '');
                return endA.localeCompare(endB);
            });

            for (let i = 1; i <= 2; i++) {
                const pos = aptsDoAndar[i - 1];
                const box = document.createElement('div');
                const boxId = `box-a${andarNum}-p${i}`;
                box.id = boxId;

                if (pos) {
                    const enderecoKey = String(pos['ENDERECO'] || '').trim();
                    const partes = enderecoKey.split('.');
                    const modulo = partes[1] || '1';
                    const realAptNum = partes[5] || `0${i}`;

                    const registroAuditado = auditDados.find(item => 
                        String(item['Endereço']).trim() === enderecoKey &&
                        String(item['Sessao'] || '1') === String(sessaoAtual)
                    );
                    
                    // CORREÇÃO: Compara limpando caracteres especiais e comparando os blocos numéricos
const limparStr = (s) => String(s || '').replace(/\D/g, '');
const keyLimpa = limparStr(enderecoKey);

let estaNoSaga = false;
for (let endSaga of enderecosSagaSet) {
    if (limparStr(endSaga).includes(keyLimpa) || keyLimpa.includes(limparStr(endSaga))) {
        estaNoSaga = true;
        break;
    }
}

                    let statusTxt = 'SAGA: Livre';
                    let stClass = '';
                    let bgStyle = '#14532d';

                    if (registroAuditado) {
                        const validador = registroAuditado['Validador'];
                        if (validador === 'Livre') { stClass = 'sim'; bgStyle = 'var(--green)'; statusTxt = 'Livre'; }
                        else if (validador === 'Ocupado') { stClass = 'nao'; bgStyle = 'var(--red)'; statusTxt = 'Ocupado'; }
                        else if (validador === 'Palete Vazio') { stClass = 'vazio'; bgStyle = 'var(--blue)'; statusTxt = 'Palete Vazio'; }
                    } else if (estaNoSaga) {
                        statusTxt = 'SAGA: Ocupado';
                        bgStyle = '#7f1d1d';
                    } else {
                        statusTxt = 'SAGA: Livre';
                        bgStyle = '#14532d';
                    }

                    box.className = `apt-box ${stClass}`;
                    box.style.background = bgStyle;
                    box.innerHTML = `
                        <div class="apt-title">Apt ${realAptNum}</div>
                        <div class="apt-sub">${statusTxt}</div>
                    `;

                    box.onclick = () => selecionarApartamento(boxId, {
                        dep: partes[0], modulo, rua, predio, andar: andarNum, apt: realAptNum, enderecoKey
                    });
                } else {
                    box.className = 'apt-box';
                    box.style.opacity = '0.3';
                    box.style.background = '#0f172a';
                    box.innerHTML = `<div class="apt-title">Apt 0${i}</div><div class="apt-sub">Vazio</div>`;
                }

                pairGrid.appendChild(box);
            }

            row.appendChild(pairGrid);
            container.appendChild(row);
        });

        const primeiraBox = container.querySelector('.apt-box:not([style*="opacity: 0.3"])');
        if (primeiraBox) primeiraBox.click();
    }

    function selecionarApartamento(boxId, posInfo) {
        document.querySelectorAll('.apt-box').forEach(b => b.classList.remove('selected'));
        const el = document.getElementById(boxId);
        if (el) el.classList.add('selected');

        selectedTempPos = posInfo;
        document.getElementById('selected-label').innerText = `Mód ${posInfo.modulo} | Préd ${posInfo.predio} | And ${posInfo.andar} | Apt ${posInfo.apt}`;
        
        setBotoesAtivos(true);
    }

    function validar(validadorBtn) {
        if (!selectedTempPos) return;

        const enderecoKey = selectedTempPos.enderecoKey;
        const sagaEstaOcupado = enderecosSagaSet.has(enderecoKey.toUpperCase());

        let acaoFinal = 'OK';
        if (sagaEstaOcupado && validadorBtn === 'Livre') {
            acaoFinal = 'Remover Saldo / Liberar Endereço';
        } else if (!sagaEstaOcupado && validadorBtn === 'Ocupado') {
            acaoFinal = 'Auditar e Registrar Produto';
        } else if (validadorBtn === 'Palete Vazio') {
            acaoFinal = 'Ajustar Saldo de Palete';
        }

        setBotoesAtivos(false);
        const st = document.getElementById('status-sync');
        st.innerText = "Salvando na nuvem...";
        st.classList.remove('online');

        const payload = {
            "Depósito": selectedTempPos.dep,
            "Módulo": selectedTempPos.modulo,
            "Ruas": selectedTempPos.rua,
            "Prédio": selectedTempPos.predio,
            "Andar": selectedTempPos.andar,
            "Apartamento": selectedTempPos.apt,
            "Endereço": enderecoKey,
            "Validador": validadorBtn,
            "Ação": acaoFinal,
            "Sessao": sessaoAtual
        };

        fetch(URL_GOOGLE_SCRIPT, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            const idx = auditDados.findIndex(item => String(item['Endereço']).trim() === enderecoKey);
            if (idx === -1) {
                auditDados.push(payload);
            } else {
                auditDados[idx]['Validador'] = validadorBtn;
                auditDados[idx]['Ação'] = acaoFinal;
            }

            st.innerText = `● Salvo no Sheets (Contagem #${sessaoAtual})`;
            st.classList.add('online');

            setBotoesAtivos(true);
            renderizarPortaPalete();
            atualizarDashboard();
        })
        .catch(err => {
            alert("Erro ao salvar lançamento no Google Sheets!");
            st.innerText = "Erro ao sincronizar";
            setBotoesAtivos(true);
        });
    }

    function iniciarNovaContagem() {
        if (confirm("Deseja finalizar a contagem atual e iniciar um NOVO inventário zerado?")) {
            sessaoAtual++;
            localStorage.setItem('sessaoAtual', sessaoAtual.toString());
            auditDados = [];
            renderizarPortaPalete();
            atualizarDashboard();
            
            const st = document.getElementById('status-sync');
            st.innerText = `● Nova Contagem #${sessaoAtual} Iniciada`;
            st.classList.add('online');
        }
    }

    function setBotoesAtivos(ativo) {
        document.getElementById('btn-sim').disabled = !ativo;
        document.getElementById('btn-nao').disabled = !ativo;
        document.getElementById('btn-vazio').disabled = !ativo;
    }

    function atualizarDashboard() {
        const totalAuditado = auditDados.length;
        const livres = auditDados.filter(d => d['Validador'] === 'Livre').length;
        const ocupados = auditDados.filter(d => d['Validador'] === 'Ocupado').length;
        const vazios = auditDados.filter(d => d['Validador'] === 'Palete Vazio').length;

        const pctLivre = totalAuditado > 0 ? ((livres / totalAuditado) * 100).toFixed(1) : 0;
        const pctOcupado = totalAuditado > 0 ? ((ocupados / totalAuditado) * 100).toFixed(1) : 0;
        const pctVazio = totalAuditado > 0 ? ((vazios / totalAuditado) * 100).toFixed(1) : 0;
        const conf = totalAuditado > 0 ? ((livres / totalAuditado) * 100).toFixed(1) : 0;

        document.getElementById('kpi-total').innerText = totalAuditado;
        document.getElementById('kpi-conf').innerText = `${conf}%`;

        document.getElementById('txt-livre').innerText = `${livres} (${pctLivre}%)`;

        document.getElementById('txt-ocupado').innerText = `${ocupados} (${pctOcupado}%)`;
        document.getElementById('bar-ocupado').style.width = `${pctOcupado}%`;

        document.getElementById('txt-vazio').innerText = `${vazios} (${pctVazio}%)`;
        document.getElementById('bar-vazio').style.width = `${pctVazio}%`;
    }
</script>
</body>
</html>
